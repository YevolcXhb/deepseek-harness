name: Build Android Mobile APK

on:
  push:
    branches: [master]
    paths:
      - 'apps/mobile/**'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        run: npm install -g pnpm@11.7.0

      - name: Install dsh dependencies & build
        run: |
          pnpm install --frozen-lockfile
          npm run build

      - name: Build rootfs asset
        run: bash apps/mobile/android/build-rootfs.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Build APK
        working-directory: apps/mobile/android
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dsh-mobile-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
